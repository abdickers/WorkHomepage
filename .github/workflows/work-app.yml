name: Build actual Work dashboard app
on:
  push:
    branches: [main]
    paths: ['android-work/**', '.github/workflows/work-app.yml']
  pull_request:
    paths: ['android-work/**', '.github/workflows/work-app.yml']
  workflow_dispatch:
concurrency:
  group: work-app-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK and test APK
        working-directory: android-work
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Work website in the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell wm size 1280x2856
            adb shell wm density 480
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell am set-debug-app --persistent com.android.chrome
            adb shell "echo chrome --disable-fre --no-default-browser-check > /data/local/tmp/chrome-command-line"
            adb shell am force-stop com.android.chrome
            adb install android-work/app/build/outputs/apk/debug/app-debug.apk
            adb install android-work/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e screenLabel pixel-portrait com.abdickers.gondor.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-portrait.log
            mkdir -p emulator-screenshots
            adb pull /sdcard/Android/data/com.abdickers.gondor/files/proof/. emulator-screenshots/ || true
            ! grep -qE 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' emulator-portrait.log
            grep -q 'OK (1 test)' emulator-portrait.log
            adb shell wm size 1080x2400
            adb shell wm density 480
            adb shell am force-stop com.android.chrome
            adb shell settings put system font_scale 1.3
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell am instrument -w -e screenLabel narrow-large-font com.abdickers.gondor.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-narrow.log
            ! grep -qE 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' emulator-narrow.log
            grep -q 'OK (1 test)' emulator-narrow.log
            mkdir -p emulator-screenshots
            adb pull /sdcard/Android/data/com.abdickers.gondor/files/proof/. emulator-screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gondor-command-work-app
          path: |
            android-work/app/build/outputs/apk/debug/app-debug.apk
            android-work/app/build/reports/
            emulator-screenshots/
            emulator-*.log
          retention-days: 30
