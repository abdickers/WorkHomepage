name: Build interactive Command widget
on:
  pull_request:
    paths: ['android-command/**', '.github/workflows/command-widget.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-command-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-widget:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            screen: pixel
            size: 1280x2856
            font: '1.0'
          - api: 35
            screen: narrow-large-text
            size: 1080x2400
            font: '1.3'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and check native widget
        working-directory: android-command
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual home-screen widget
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density 480
            adb shell settings put system font_scale ${{ matrix.font }}
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb install android-command/app/build/outputs/apk/debug/app-debug.apk
            adb install android-command/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.abdickers.realms.test/androidx.test.runner.AndroidJUnitRunner | tee command-emulator.log
            mkdir -p emulator-screenshots
            adb pull /sdcard/Android/data/com.abdickers.realms/files/screenshots/. emulator-screenshots/ || true
            ! grep -qE 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' command-emulator.log
            grep -q 'OK (3 tests)' command-emulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-command-${{ matrix.screen }}
          path: |
            android-command/app/build/outputs/apk/debug/app-debug.apk
            android-command/app/build/reports/
            command-emulator.log
            emulator-screenshots/
          retention-days: 30
