name: Build interactive Command widget
on:
  pull_request:
    paths: ['android-command/**', '.github/workflows/command-widget.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-command-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-widget:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            screen: pixel
            size: 1280x2856
            font: '1.0'
          - api: 35
            screen: narrow-large-text
            size: 1080x2400
            font: '1.3'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install setup encryption verifier
        run: python -m pip install cryptography==50.0.2
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare the approved stable signing key
        env:
          COMMAND_KEYSTORE_BASE64: ${{ secrets.COMMAND_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$COMMAND_KEYSTORE_BASE64" ]; then
            printf '%s' "$COMMAND_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/command.p12"
            chmod 600 "$RUNNER_TEMP/command.p12"
            echo "COMMAND_KEYSTORE_FILE=$RUNNER_TEMP/command.p12" >> "$GITHUB_ENV"
          fi
      - name: Compile and check native widget
        working-directory: android-command
        env:
          COMMAND_KEYSTORE_PASSWORD: ${{ secrets.COMMAND_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify the APK signing identity
        if: env.COMMAND_KEYSTORE_FILE != ''
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APK_SIGNER" verify --print-certs android-command/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/signing-certificate.txt"
          python3 -c 'import json,os; expected=json.load(open("android-command/signing-certificate.json"))["sha256"].lower(); actual=open(os.environ["RUNNER_TEMP"]+"/signing-certificate.txt").read().lower(); assert expected in actual, "Unexpected APK signing certificate"'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual home-screen widget
        uses: reactivecircus/android-emulator-runner@v2
        env:
          COMMAND_KEYSTORE_PASSWORD: ${{ secrets.COMMAND_KEYSTORE_PASSWORD }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density 480
            adb shell settings put system font_scale ${{ matrix.font }}
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb install android-command/app/build/outputs/apk/debug/app-debug.apk
            adb install android-command/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.abdickers.realms.ProvisionBootstrap com.abdickers.realms.test/androidx.test.runner.AndroidJUnitRunner | tee command-setup.log
            grep -q 'OK (1 test)' command-setup.log
            adb pull /sdcard/Android/data/com.abdickers.realms/files/setup-request.json "$RUNNER_TEMP/setup-request.json"
            if [ -n "$COMMAND_KEYSTORE_FILE" ]; then python scripts/seal-command-setup.py --ci-test --request "$RUNNER_TEMP/setup-request.json" --output "$RUNNER_TEMP/setup-reply.json"; fi
            if [ -f "$RUNNER_TEMP/setup-reply.json" ]; then adb push "$RUNNER_TEMP/setup-reply.json" /sdcard/Android/data/com.abdickers.realms/files/setup-reply.json; fi
            adb shell am instrument -w -e notClass com.abdickers.realms.ProvisionBootstrap com.abdickers.realms.test/androidx.test.runner.AndroidJUnitRunner | tee command-emulator.log
            adb logcat -d -s RemoteViews AppWidgetHostView AndroidRuntime > command-widget-diagnostics.log
            mkdir -p emulator-screenshots
            adb pull /sdcard/Android/data/com.abdickers.realms/files/screenshots/. emulator-screenshots/ || true
            ! grep -qE 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' command-emulator.log
            grep -q 'OK (14 tests)' command-emulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-command-${{ matrix.screen }}
          path: |
            android-command/app/build/outputs/apk/debug/app-debug.apk
            android-command/app/build/reports/
            command-emulator.log
            command-setup.log
            command-widget-diagnostics.log
            emulator-screenshots/
          retention-days: 30
